version: 2.1

executors:
  elixir-executor:
    docker:
      - image: elixir:1.18
    working_directory: ~/repo
    environment:
      MIX_ENV: test

  python-executor:
    docker:
      - image: cimg/python:3.11
    working_directory: ~/repo

jobs:
  metadata-check:
    executor: python-executor
    steps:
      - checkout
      - run:
          name: "Verify Version Synchronization"
          command: |
            python scripts/sync_release.py --check
      - run:
          name: "Verify Zero-Emoji Rule"
          command: |
            python scripts/sync_release.py --emoji-check
      - run:
          name: "Run Release Script Unit Tests"
          command: |
            python scripts/test_sync_release.py -v

  unit-tests:
    executor: elixir-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-deps-{{ checksum "mix.lock" }}
            - v1-deps-
      - run:
          name: "Install Hex and Rebar"
          command: |
            mix local.hex --force
            mix local.rebar --force
      - run:
          name: "Install Dependencies"
          command: mix deps.get
      - save_cache:
          key: v1-deps-{{ checksum "mix.lock" }}
          paths:
            - deps
            - _build
      - run:
          name: "Check Code Formatting"
          command: mix format --check-formatted
      - run:
          name: "Compile Code with Warnings as Errors"
          command: mix compile --warnings-as-errors
      - run:
          name: "Run Unit Tests"
          command: mix test

  integration-tests:
    executor: elixir-executor
    steps:
      - checkout
      - setup_remote_docker:
          version: default
      - restore_cache:
          keys:
            - v1-deps-{{ checksum "mix.lock" }}
            - v1-deps-
      - run:
          name: "Install Hex and Rebar"
          command: |
            mix local.hex --force
            mix local.rebar --force
      - run:
          name: "Install Dependencies"
          command: mix deps.get
      - run:
          name: "Build and Start Docker SSH Test Target"
          command: docker compose -f docker-compose.test.yml up -d --build
      - run:
          name: "Run Integration Tests"
          command: mix test test/integration --include integration
      - run:
          name: "Tear Down Docker SSH Test Target"
          command: docker compose -f docker-compose.test.yml down
          when: always

workflows:
  version: 2
  build-and-test:
    jobs:
      - metadata-check
      - unit-tests
      - integration-tests:
          requires:
            - metadata-check
            - unit-tests