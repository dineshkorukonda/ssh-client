name: CI

on:
  pull_request:
    branches: [ "main", "fix/phase-1-ssh-reliability" ]
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata-check:
    name: Verify Release Metadata & Aesthetic Rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Version Synchronization
        run: |
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/v* ]]; then
            TAG_VER="${REF#refs/tags/v}"
            python scripts/sync_release.py --check "$TAG_VER"
          else
            python scripts/sync_release.py --check
          fi

      - name: Verify Zero-Emoji Rule
        run: python scripts/sync_release.py --emoji-check

      - name: Run Release Script Unit Tests
        run: python scripts/test_sync_release.py -v

      - name: Run Release Workflow Regression Tests
        run: python scripts/test_release_workflows.py -v

  test:
    name: Backend Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Elixir and Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.2'
          otp-version: '27.2'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run unit test suite
        run: mix test

      - name: Run real SSH, PTY and SFTP integration suite
        run: mix test test/integration/local_ssh_integration_test.exs --include integration

  native-windows:
    name: Native Windows App and Installer Validation
    runs-on: windows-latest
    needs: [metadata-check, test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Elixir and Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.2'
          otp-version: '27.2'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build native application and production backend
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Validate native terminal, SFTP and backend cleanup
        shell: pwsh
        run: ./scripts/test_native_windows.ps1

      - name: Archive Windows Release (zip)
        shell: pwsh
        run: |
          Compress-Archive -Path _build\prod\rel\ssh_client\* -DestinationPath ssh-client-windows-x64.zip

      - name: Cache Inno Setup
        id: innosetup-cache
        uses: actions/cache@v4
        with:
          path: C:\Program Files (x86)\Inno Setup 6
          key: innosetup-6

      - name: Install Inno Setup
        if: steps.innosetup-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: choco install innosetup --no-progress

      - name: Add Inno Setup to PATH
        shell: pwsh
        run: echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -Append -FilePath $env:GITHUB_PATH

      - name: Build Windows installer (.exe)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer.iss

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-client-windows-x64-zip
          path: ssh-client-windows-x64.zip

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-client-windows-x64-installer
          path: installer\ssh-client-setup-v*-windows-x64.exe

  package-linux:
    name: Package Linux Release (.tar.gz)
    runs-on: ubuntu-latest
    needs: [metadata-check, test]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Elixir and Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.2'
          otp-version: '27.2'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Build production release
        run: MIX_ENV=prod mix release ssh_client

      - name: Archive Linux Release (tar.gz)
        run: tar -C _build/prod/rel/ssh_client -czf ssh-client-linux-x64.tar.gz .

      - name: Upload Linux tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-client-linux-x64-tarball
          path: ssh-client-linux-x64.tar.gz

  publish-container:
    name: Publish container image (GHCR)
    runs-on: ubuntu-latest
    needs: [metadata-check, test]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve image version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(python scripts/sync_release.py --get-current)" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

  release:
    name: Create GitHub Release & Publish Assets
    runs-on: ubuntu-latest
    needs: [native-windows, package-linux, publish-container]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ssh-client-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          name: "${{ github.ref_name }} (Beta)"
          files: |
            dist/*
