name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Elixir and Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.2'
          otp-version: '27.2'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Check and apply formatting
        if: matrix.os == 'ubuntu-latest'
        run: mix format

      - name: Run unit test suite
        run: mix test

  integration-test:
    name: Integration Tests (Docker SSH Target)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Elixir and Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.2'
          otp-version: '27.2'

      - name: Install dependencies
        run: mix deps.get

      - name: Build and start SSH test fixture
        run: docker compose -f docker-compose.test.yml up -d --build

      - name: Run integration tests
        run: mix test test/integration --include integration

      - name: Tear down test fixture
        if: always()
        run: docker compose -f docker-compose.test.yml down

  package-windows:
    name: Package Windows Release (.zip + .exe installer)
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Elixir and Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.2'
          otp-version: '27.2'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Build production release
        run: |
          $env:MIX_ENV = "prod"
          mix release ssh_client
          Copy-Item priv\launch-gui.bat _build\prod\rel\ssh_client\bin\launch-gui.bat
          Copy-Item priv\launch-gui.vbs _build\prod\rel\ssh_client\bin\launch-gui.vbs

      - name: Archive Windows Release (zip)
        shell: pwsh
        run: |
          Compress-Archive -Path _build\prod\rel\ssh_client\* -DestinationPath ssh-client-windows-x64.zip

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -Append -FilePath $env:GITHUB_PATH

      - name: Build Windows installer (.exe)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer.iss

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-client-windows-x64-zip
          path: ssh-client-windows-x64.zip

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-client-windows-x64-installer
          path: installer\ssh-client-setup-v*-windows-x64.exe

  package-linux:
    name: Package Linux Release (.tar.gz)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Elixir and Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.2'
          otp-version: '27.2'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Build production release
        run: |
          MIX_ENV=prod mix release ssh_client

      - name: Archive Linux Release
        run: |
          tar -czf ssh-client-linux-x64.tar.gz -C _build/prod/rel/ssh_client .

      - name: Upload Linux Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-client-linux-x64
          path: ssh-client-linux-x64.tar.gz

  package-docker:
    name: Package Container Image (GitHub Packages GHCR)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=0.0.1,enable=true
            type=raw,value=0.0.1-beta,enable=true
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release & Publish Assets
    runs-on: ubuntu-latest
    needs: [package-windows, package-linux, package-docker]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create dist directory
        run: mkdir -p dist

      - name: Download Windows zip artifact
        uses: actions/download-artifact@v4
        with:
          name: ssh-client-windows-x64-zip
          path: dist

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: ssh-client-windows-x64-installer
          path: dist

      - name: Download Linux Release Artifact
        uses: actions/download-artifact@v4
        with:
          name: ssh-client-linux-x64
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          make_latest: true
          name: "v0.0.1 (Beta) - Initial Release"
          body_path: ./RELEASE_NOTES.md
          files: |
            dist/*
