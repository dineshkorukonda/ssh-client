name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  metadata-check:
    name: Verify Release Metadata & Aesthetic Rules
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Version Synchronization
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}"
          if ($ref -like "refs/tags/v*") {
            $tagVersion = $ref -replace "refs/tags/v", ""
            python scripts/sync_release.py --check $tagVersion
          } else {
            python scripts/sync_release.py --check
          }

      - name: Verify Zero-Emoji Rule
        run: python scripts/sync_release.py --emoji-check

      - name: Run Release Script Unit Tests
        run: python scripts/test_sync_release.py -v

  test:
    name: Unit Tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Elixir and Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.2'
          otp-version: '27.2'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Run unit test suite
        run: mix test



  package-windows:
    name: Package Windows Release (.zip + .exe installer)
    runs-on: windows-latest
    needs: [test, metadata-check]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Elixir and Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.2'
          otp-version: '27.2'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Build production release
        run: |
          $env:MIX_ENV = "prod"
          mix release ssh_client
          Copy-Item priv\launch-gui.bat _build\prod\rel\ssh_client\bin\launch-gui.bat
          Copy-Item priv\launch-gui.vbs _build\prod\rel\ssh_client\bin\launch-gui.vbs

      - name: Archive Windows Release (zip)
        shell: pwsh
        run: |
          Compress-Archive -Path _build\prod\rel\ssh_client\* -DestinationPath ssh-client-windows-x64.zip

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -Append -FilePath $env:GITHUB_PATH

      - name: Build Windows installer (.exe)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer.iss

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-client-windows-x64-zip
          path: ssh-client-windows-x64.zip

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-client-windows-x64-installer
          path: installer\ssh-client-setup-v*-windows-x64.exe


  release:
    name: Create GitHub Release & Publish Assets
    runs-on: windows-latest
    needs: [package-windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create dist directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path dist

      - name: Download Windows zip artifact
        uses: actions/download-artifact@v4
        with:
          name: ssh-client-windows-x64-zip
          path: dist

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: ssh-client-windows-x64-installer
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          make_latest: true
          name: "${{ github.ref_name }} (Beta)"
          body_path: ./RELEASE_NOTES.md
          files: |
            dist/*
