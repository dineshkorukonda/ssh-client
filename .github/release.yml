changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - github-actions[bot]
  categories:
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Bug Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: CI and Release
      labels:
        - ci
    - title: Testing
      labels:
        - testing
    - title: Security
      labels:
        - security
    - title: Other Changes
      labels:
        - "*"
